<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Большая ОШИБКА</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { height:100%; margin:0; background:#000; font-family:Arial, sans-serif; }
    .center { height:100%; display:flex; align-items:center; justify-content:center; }

    #panicBtn {
      padding:18px 34px;
      font-size:28px;
      background:#c62828;
      color:white;
      border:none;
      border-radius:10px;
      cursor:pointer;
      box-shadow:0 6px 18px rgba(0,0,0,.6);
    }

    #errorOverlay {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.9);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9999;
      visibility:hidden;
      opacity:0;
      transition:opacity .25s ease, visibility .25s;
    }

    #errorOverlay.show {
      visibility:visible;
      opacity:1;
    }

    .errorText {
      color:#ff0a0a;
      font-size:12vw;
      font-weight:900;
      letter-spacing:1vw;
      text-shadow:
        0 0 8px rgba(255,10,10,0.9),
        0 0 24px rgba(255,10,10,0.6),
        0 0 48px rgba(255,80,80,0.3);
      transform-origin:center;
      animation:shake 0.6s infinite linear, pulse 1.2s infinite ease-in-out;
      text-align:center;
      user-select:none;
    }

    @keyframes shake {
      0% { transform:translateX(0) rotate(0deg); }
      20% { transform:translateX(-8px) rotate(-1deg); }
      40% { transform:translateX(8px) rotate(1deg); }
      60% { transform:translateX(-6px) rotate(-1deg); }
      80% { transform:translateX(6px) rotate(1deg); }
      100% { transform:translateX(0) rotate(0deg); }
    }

    @keyframes pulse {
      0% { filter:brightness(1); }
      50% { filter:brightness(1.6); }
      100% { filter:brightness(1); }
    }
  </style>
</head>
<body>
  <div class="center">
    <button id="panicBtn">Нажми — большая ОШИБКА</button>
  </div>

  <div id="errorOverlay" aria-hidden="true">
    <div class="errorText">ОШИБКА</div>
  </div>

  <audio id="errorAudio" src="audio/error.mp3" loop></audio>

  <script>
    const btn = document.getElementById('panicBtn');
    const overlay = document.getElementById('errorOverlay');
    const audio = document.getElementById('errorAudio');

    btn.addEventListener('click', async () => {
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');

      try {
        await audio.play();
      } catch(e) {
        console.warn("Автовоспроизведение может быть заблокировано браузером.");
      }
    });
  </script>
</body>
</html>
